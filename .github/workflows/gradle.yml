name: Build TenorClef

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# TenorClef always runs on Ostinato, so only the versions Ostinato is built for are compiled:
# 1.21.4 and 1.16.1 (jars committed in libs/) and 1.21.11 (Ostinato main, built here).
# The other versions are preprocess-only nodes (see build.gradle).
# Tungsten is OPTIONAL — jobs must pass without a tungsten jar.
#
# Required green: 1.21.4 + 1.16.1. Experimental / non-blocking: 1.21.11 (Ostinato branch 1.21.11).

jobs:
  build-1214:
    name: Compile Fabric 1.21.4 (Ostinato 1.21.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify staged Ostinato 1.21.4 jar
        run: ls -la libs/baritone-unoptimized-fabric-1.21.4.jar
      - name: Compile 1.21.4 module
        run: ./gradlew :1.21.4:compileJava --stacktrace
      # Unit tests are pure Java (no Minecraft client).
      - name: Unit tests
        run: ./gradlew :1.21.4:test --stacktrace
      - name: Upload jars (if produced)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tenorclef-1.21.4
          path: versions/1.21.4/build/libs/*.jar
          if-no-files-found: ignore
          retention-days: 14

  build-12111:
    name: Compile Fabric 1.21.11 (Ostinato 1.21.11)
    # Tip Ostinato + Item/ItemStack drift still red intermittently; do not block PRs.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Stage Ostinato tip as sibling ../Ostinato (matches local Windows layout).
      - name: Checkout Ostinato tip
        uses: actions/checkout@v4
        with:
          repository: vexrypt-rgb/Ostinato
          ref: '1.21.11'
          path: _ostinato_tip

      - name: Build Ostinato Fabric jar into sibling dist
        id: stage_ostinato
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x _ostinato_tip/gradlew
          if ! (cd _ostinato_tip && ./gradlew :fabric:build -x test --stacktrace); then
            echo "::warning::Ostinato tip build failed; 1.21.11 needs the Ostinato jar — skipping compile"
            echo "staged=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/../Ostinato/dist" libs
          shopt -s nullglob
          jars=(_ostinato_tip/dist/baritone-unoptimized-fabric-*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            jars=(_ostinato_tip/dist/baritone-*-fabric-*.jar)
          fi
          if [ ${#jars[@]} -eq 0 ]; then
            echo "::warning::No Ostinato fabric jars in dist/; 1.21.11 requires a staged tip jar"
            echo "staged=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          cp -v "${jars[@]}" "$GITHUB_WORKSPACE/../Ostinato/dist/"
          # libs/ pattern also accepts baritone-unoptimized-fabric-ostinato*.jar
          for j in "${jars[@]}"; do
            base="$(basename "$j")"
            case "$base" in
              *1.16.1*|*ostinato-1.16*) continue ;;
            esac
            cp -v "$j" "libs/baritone-unoptimized-fabric-ostinato-tip.jar"
            break
          done
          ls -la "$GITHUB_WORKSPACE/../Ostinato/dist" libs/baritone-unoptimized-fabric-ostinato-tip.jar || true
          echo "staged=true" >> "$GITHUB_OUTPUT"

      - name: Compile 1.21.11 module
        if: steps.stage_ostinato.outputs.staged == 'true'
        run: ./gradlew :1.21.11:compileJava --stacktrace

  build-1161:
    name: Compile Fabric 1.16.1 (Ostinato legacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify staged Ostinato 1.16.1 jar
        run: |
          set -euo pipefail
          if [ -f libs/baritone-unoptimized-fabric-1.16.1.jar ]; then
            ls -la libs/baritone-unoptimized-fabric-1.16.1.jar
          else
            echo "::error::Missing libs/baritone-unoptimized-fabric-1.16.1.jar (committed stub required for CI)"
            exit 1
          fi

      - name: Compile 1.16.1 module
        run: ./gradlew :1.16.1:compileJava --stacktrace
